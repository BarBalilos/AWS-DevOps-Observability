# helm/kube-prometheus-stack/values.yaml
#
# Overrides for prometheus-community/kube-prometheus-stack, pinned to chart
# version 88.5.4 (app version v0.93.1 / Prometheus Operator).
#
# Install with:
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --version 88.5.4 \
#     --namespace observability \
#     -f helm/kube-prometheus-stack/values.yaml
#
# SELECTOR STRATEGY (documented per assignment brief requirement):
# We deliberately do NOT set serviceMonitorSelector/podMonitorSelector/ruleSelector
# to {} directly (which would mean "match everything, cluster-wide, unlabeled").
# Instead we keep the chart's *SelectorNilUsesHelmValues flags at their default
# `true`, which makes Prometheus Operator render a selector requiring the label
#     release: kube-prometheus-stack
# on every ServiceMonitor / PodMonitor / PrometheusRule it will pick up — that
# label value comes from the Helm release name used in the install command above
# ("kube-prometheus-stack"). Every monitor/rule file we add later (backend, worker,
# frontend, jenkins) MUST carry this exact label, or Prometheus silently ignores it
# — no error, it just never shows up as a target. This is our "clear selector
# strategy": explicit opt-in by label, not implicit cluster-wide discovery.
#
# NAMESPACE SCOPE: serviceMonitorNamespaceSelector / podMonitorNamespaceSelector
# are left at their default {} (empty selector = match ALL namespaces), which is
# what we need — our app's monitors will live in devops-app and Jenkins's will
# live in jenkins, neither is inside the observability namespace itself.
prometheus:
  prometheusSpec:
    replicas: 1
    # --- retention: documented per brief requirement ---
    # Time-based retention (primary) plus a size-based safety cap so Prometheus
    # never fills the PVC even if scrape volume grows faster than expected.
    retention: "10d"
    retentionSize: "8GB"
    # --- resources: sized against actually-measured headroom ---
    # Cluster has ~16 vCPU / ~15GB shared across both k3d nodes; current combined
    # usage (Jenkins + app + k3s system pods) is ~155m CPU / ~1.1GB memory. These
    # requests/limits give Prometheus real room without starving anything else.
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # --- storage: PVC on k3d's local-path StorageClass ---
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    # --- selector strategy (see header comment above) ---
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true
    probeSelectorNilUsesHelmValues: true
    scrapeConfigSelectorNilUsesHelmValues: true
    # Explicitly documented as {} (= all namespaces) — see header comment.
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
grafana:
  # --- admin credentials: intentionally left at chart defaults ---
  # We do NOT set adminPassword or admin.existingSecret here. Left unset, Grafana's
  # chart auto-generates a random admin password and stores it in a Kubernetes
  # Secret named "kube-prometheus-stack-grafana" — it never appears in any file we
  # commit. Retrieve it locally (never paste the output into chat or into a
  # committed file) with:
  #   kubectl get secret -n observability kube-prometheus-stack-grafana \
  #     -o jsonpath="{.data.admin-password}" | base64 -d
  # --- persistence: intentionally left DISABLED (chart default) ---
  # Grafana's own database (anything saved by clicking in the UI: ad-hoc panels,
  # manual datasource edits, org settings) is ephemeral — it resets on every pod
  # restart. This is deliberate, not an oversight: it structurally enforces
  # "Observability as Code" from the brief. Anything configured only by clicking in
  # the Grafana UI cannot survive a restart, so if a dashboard or datasource still
  # works after `kubectl rollout restart`, that's proof it came from Git (via the
  # sidecar-loaded ConfigMaps below), not from a manual click that would otherwise
  # not count as a deliverable.
  # --- resources: bumped from chart-default sizing ---
  # Original sizing (100m/128Mi requests, 250m/256Mi limits) was too tight once
  # dashboards + both k8s-sidecar containers + Grafana's unified-storage (bleve)
  # indexing are all running in the same pod: observed CPU pegged at its 250m
  # limit and memory over the 256Mi limit, causing the liveness probe to time out
  # (context deadline exceeded) and the grafana container to be SIGKILLed (exit
  # 137) in a restart loop. Raised to give real headroom.
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # --- exposure: no Ingress, port-forward only (per project decision) ---
  ingress:
    enabled: false
  sidecar:
    # --- automatic dashboard provisioning from files in Git ---
    # These are chart DEFAULTS, made explicit here for documentation (Observability
    # as Code requirement). The sidecar watches for ConfigMaps labeled
    #   grafana_dashboard: "1"
    # in ANY namespace and auto-loads their JSON as a dashboard — no manual import.
    # scripts/install.sh turns each file in grafana/dashboards/*.json into exactly
    # such a labeled ConfigMap.
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      provider:
        allowUiUpdates: false   # UI edits to a provisioned dashboard don't silently
                                # diverge from its Git source — reinforces as-code.
    # --- automatic datasource provisioning ---
    # Also a chart default, documented explicitly. Auto-creates a "Prometheus"
    # datasource pointed at this release's own Prometheus, AND an "Alertmanager"
    # datasource — zero manual "Add data source" clicks required.
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      alertmanager:
        enabled: true
alertmanager:
  # --- exposure: no Ingress, port-forward only (per project decision) ---
  ingress:
    enabled: false
  alertmanagerSpec:
    replicas: 1
    # Default retention (5 days) is fine — this only governs how long Alertmanager
    # keeps its own notification/silence history, not metrics.
    retention: 120h
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # Unlike Grafana, Alertmanager's state (active silences, notification log) is
    # kept persistent on purpose — that's real operational history, not something
    # we want reset on every pod restart.
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
  # --- safe demo receiver ---
  # Routes every alert to a tiny in-cluster HTTP echo service (see
  # alertmanager/demo-receiver.yaml) instead of any real external target. This is
  # deliberate: it's a genuinely working, delivered notification (not a silent
  # `null` receiver) that proves the whole alerting path end-to-end, with zero
  # external dependency, zero cost, and zero risk of paging a real person. Its
  # target is an in-cluster Service DNS name — not sensitive, so no secret is
  # needed for this receiver specifically.
  #
  # To point this at a REAL channel later (e.g. Slack) without breaking the
  # "secrets stay out of Git" rule: create a Kubernetes Secret holding the webhook
  # URL/token (kubectl create secret ..., never committed) and reference it via
  # alertmanager.alertmanagerSpec.alertmanagerConfigSelector + an AlertmanagerConfig
  # CRD, rather than inlining the URL below.
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['namespace', 'alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'demo-webhook'
      routes:
      - receiver: 'null'
        matchers:
          - alertname = "Watchdog"
    receivers:
    - name: 'null'
    - name: 'demo-webhook'
      webhook_configs:
      - url: 'http://alertmanager-demo-receiver.observability.svc.cluster.local:8080/alerts'
        send_resolved: true
    templates:
    - '/etc/alertmanager/config/*.tmpl'